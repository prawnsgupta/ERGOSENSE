name: ERGOSENSE tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:                      # same image as docker-compose, so the DB tests run too
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ergosense
          POSTGRES_PASSWORD: ergosense
          POSTGRES_DB: ergosense
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ergosense -d ergosense"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ergosense:ergosense@127.0.0.1:5433/ergosense
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r ergosense/requirements.txt
      - name: Run tests
        run: python -m pytest -q
