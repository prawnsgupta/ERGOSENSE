# Minimal Mosquitto 2.x config for local development.
# Mosquitto 2 refuses remote connections unless a listener is declared explicitly.
listener 1883 0.0.0.0

# Anonymous access is fine because docker-compose only exposes the port on 127.0.0.1.
# For a LAN demo, add a password_file and set allow_anonymous false (see README).
allow_anonymous true

# Persist retained messages and the queues of persistent (clean_session=false) clients,
# so QoS 1 events published while the backend is down are delivered when it comes back.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Upper bound on messages queued per offline client (protects broker memory).
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
